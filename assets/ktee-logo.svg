  <text x="355" y="158" fill="#a3e635" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="100" font-weight="800" letter-spacing="-5">Tee</text>
  <text x="289" y="204" fill="#a8b8cf" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="600" letter-spacing="2">SEE THE VALUE · KEEP THE FLOW</text>
