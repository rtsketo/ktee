<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 280" role="img" aria-labelledby="title desc">
  <title id="title">KTee</title>
  <desc id="desc">A flowing K-shaped pipeline beside the KTee wordmark.</desc>
  <defs>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a3e635"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101b31"/>
      <stop offset="1" stop-color="#0b1223"/>
