  </defs>
  <rect width="930" height="280" rx="40" fill="url(#panel)"/>
  <rect x="40" y="40" width="200" height="200" rx="48" fill="#18283c" stroke="#315067" stroke-width="2"/>
  <path d="M94 89v102m0-51 82-51m-82 51 82 51" fill="none" stroke="url(#flow)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
